        // Utility for Gemini AI API Calls with Offline Robust Fallbacks
        const runAiService = async (taskType, payload, apiKey = "") => {
            if (!apiKey) {
                // Return rich simulated mock responses if API Key is not set
                await new Promise(r => setTimeout(r, 1200)); // Simulate thinking latency
                switch(taskType) {
                    case 'RESUME_ANALYSIS':
                        return {
                            score: 84,
                            atsScore: 88,
                            technicalScore: 82,
                            formattingScore: 90,
                            strengths: [
                                "Clear structured format with modern developer tech stack highlighted",
                                "Good balance of project work with live GitHub deployment URLs",
                                "Consistent mention of programming languages and RESTful API standards"
                            ],
                            improvements: [
                                "Quantify outcomes in project bullet points (e.g., 'Improved performance by 35%')",
                                "Include Docker and Containerization keywords for modern backend roles",
                                "Explicitly list database indexing and SQL query optimization skills"
                            ],
                            suggestedKeywords: ["Docker", "Kubernetes", "Redis", "CI/CD Pipelines", "System Architecture"]
                        };

                    case 'SKILL_GAP':
                        const targetRole = payload.targetRole || "Java Backend Developer";
                        const reqSkills = TARGET_ROLE_SKILLS[targetRole] || TARGET_ROLE_SKILLS["Java Backend Developer"];
                        const userSkills = payload.userSkills || [];
                        const matched = reqSkills.filter(s => userSkills.some(us => us.toLowerCase() === s.toLowerCase()));
                        const missing = reqSkills.filter(s => !matched.includes(s));
                        return {
                            role: targetRole,
                            matchPercent: Math.round((matched.length / reqSkills.length) * 100),
                            matchedSkills: matched,
                            missingSkills: missing,
                            roadmap: [
                                `Master the core fundamentals of ${missing[0] || 'Spring Security'}`,
                                `Build 1 full-featured open-source project incorporating ${missing[1] || 'Docker'}`,
                                `Practice 30+ medium SQL query optimization challenges on LeetCode/HackerRank`,
                                `Review REST architectural constraints and authentication strategies (JWT/OAuth)`
                            ]
                        };

                    case 'JOB_MATCHING':
                        return {
                            matchPercentage: 89,
                            skillsMatch: 85,
                            resumeMatch: 90,
                            eligibilityScore: 100,
                            recommendation: "Strong Candidate - High chance of technical round shortlist.",
                            keyGaps: ["Spring Security experience", "AWS Cloud basics"]
                        };

                    case 'INTERVIEW_PREP':
                        return {
                            questions: [
                                { category: "Technical Core", question: "Explain the internal working of Java HashMap and how collisions are handled in Java 8+.", answerKey: "Treeifying buckets when threshold exceeds 8 elements." },
                                { category: "System Design", question: "How would you design an idempotent payment processing API endpoint?", answerKey: "Using unique request transaction UUIDs in Redis caching layer." },
                                { category: "DSA / Coding", question: "Describe how to find the starting node of a cycle in a Linked List using Floyd's algorithm.", answerKey: "Fast and slow pointers meeting point logic." },
                                { category: "Behavioral", question: "Tell me about a technical conflict during your capstone project and how you resolved it.", answerKey: "Focus on communication, benchmark testing, and team consensus." }
                            ]
                        };

                    case 'CHAT_ASSISTANT':
                        return `Based on your profile (CGPA ${payload.cgpa || 8.4}, ${payload.department || 'CSE'}), you are in a great position for top product drives. Focus on solving 2 LC Medium questions daily and polishing your React + Node.js full stack project descriptions on your resume.`;
                    
                    default:
                        return "AI Service processed task successfully.";
                }
            }

            // Real Gemini API Request Handling
            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                let prompt = "";
                if (taskType === 'CHAT_ASSISTANT') {
                    prompt = `You are CampusHire AI Career Coach. User query: "${payload.prompt}". Profile: ${JSON.stringify(payload.profile)}. Provide concise, high-value advice.`;
                } else {
                    prompt = `Task: ${taskType}. Payload: ${JSON.stringify(payload)}. Respond with JSON format relevant to placement career preparation.`;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                if (taskType === 'CHAT_ASSISTANT') return rawText;
                
                // Attempt to parse JSON from response
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (jsonMatch) return JSON.parse(jsonMatch[0]);
                return { response: rawText };
            } catch (err) {
                console.warn("API Error, falling back to smart local response", err);
                return runAiService(taskType, payload, ""); // Retry with fallback engine
            }
        };

                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: ANNOUNCEMENTS */}
                        {activeTab === 'announcements' && (
                            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs max-w-2xl space-y-4">
                                <h2 className="text-lg font-bold text-slate-900">Broadcast Campus Announcement</h2>
                                <form onSubmit={(e) => { e.preventDefault(); onTriggerToast("Announcement published to student portals!", "success"); }} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Title</label>
                                        <input type="text" placeholder="e.g. Amazon Placement Drive Registration" required className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs outline-none focus:ring-2 focus:ring-brand-500" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Target Audience</label>
                                        <select className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs outline-none">
                                            <option>All Final Year Students</option>
                                            <option>CSE & AI&DS Only</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Announcement Body</label>
                                        <textarea rows={4} placeholder="Type announcement details..." required className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                                    </div>
                                    <button type="submit" className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl transition shadow-xs">
                                        Broadcast Announcement
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        
        const AdminDashboard = ({ onTriggerToast }) => {
            return (
                <div className="max-w-7xl mx-auto p-6 space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-extrabold text-slate-900">System Administration & Audit</h1>
                            <p className="text-xs text-slate-500 mt-1">Platform operational status and role provisioning.</p>
                        </div>
                        <span className="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full">SYSTEM HEALTH: 100% OPERATIONAL</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                            <h3 className="font-bold text-slate-800 text-sm mb-4">User Provisioning</h3>
                            <button onClick={() => onTriggerToast("Account provisioning modal open", "info")} className="w-full py-2.5 bg-brand-600 text-white text-xs font-bold rounded-xl hover:bg-brand-700 transition">
                                + Provision TPO Account
                            </button>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                            <h3 className="font-bold text-slate-800 text-sm mb-4">AI Engine Configuration</h3>
                            <p className="text-xs text-slate-500 mb-3">Model: Gemini 3 Flash / Fallback Mode Active</p>
                            <button onClick={() => onTriggerToast("AI settings updated", "success")} className="w-full py-2.5 bg-slate-800 text-white text-xs font-bold rounded-xl hover:bg-slate-900 transition">
                                Configure API Key
                            </button>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                            <h3 className="font-bold text-slate-800 text-sm mb-4">System Audit Logs</h3>
                            <div className="text-[11px] text-slate-500 space-y-2">
                                <div>• TPO Robert Vance posted announcement (10 mins ago)</div>
                                <div>• Student Alex Rivera completed ATS scan (25 mins ago)</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        
        const DocumentationPage = () => {
            return (
                <div className="max-w-5xl mx-auto px-4 py-10 space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-slate-900">Architecture & Technical Specs</h1>
                        <p className="text-slate-600 text-sm mt-1">Database Schema, API Endpoints, and Production Deployment Guide for CampusHire AI.</p>
                    </div>

                    {/* Firestore Collection Blueprint */}
                    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
                        <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="database" className="w-5 h-5 text-brand-600"></i>
                            Firebase Firestore Collection Schema
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {[
                                { col: "/artifacts/{appId}/public/data/students", desc: "Student academic records, skills matrix, CGPA, backlog counts, resume score." },
                                { col: "/artifacts/{appId}/public/data/companies", desc: "Recruitment drive postings, eligibility rules, salary packages, deadlines." },
                                { col: "/artifacts/{appId}/public/data/applications", desc: "Application status tracker, recruitment step indices, submission timestamps." },
                                { col: "/artifacts/{appId}/public/data/announcements", desc: "Placement drive broadcasts, assessment schedules, target department flags." }
                            ].map((sc, i) => (
                                <div key={i} className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                                    <div className="font-mono font-bold text-brand-700">{sc.col}</div>
                                    <p className="text-slate-600 mt-1">{sc.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* REST API Endpoints */}
                    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
                        <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="network" className="w-5 h-5 text-brand-600"></i>
                            REST API Architecture Overview
                        </h2>

                        <div className="space-y-2 text-xs font-mono">
                            <div className="p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex justify-between">
                                <span className="font-bold text-emerald-700">POST /api/v1/ai/analyze-resume</span>
                                <span className="text-slate-500 font-sans">Trigger ATS keyword analysis</span>
                            </div>
                            <div className="p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex justify-between">
                                <span className="font-bold text-blue-700">GET /api/v1/students/skill-gap</span>
                                <span className="text-slate-500 font-sans">Compare skills against target role</span>
                            </div>
                            <div className="p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex justify-between">
                                <span className="font-bold text-purple-700">POST /api/v1/drives/apply</span>
                                <span className="text-slate-500 font-sans">Submit job drive application</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        
        const LoginPage = ({ onLogin, onNavigate }) => {
            const [role, setRole] = useState('student');

            return (
                <div className="min-h-[calc(100vh-4rem)] flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl max-w-md w-full space-y-6">
                        <div className="text-center">
                            <h2 className="text-2xl font-extrabold text-slate-900">Sign In to CampusHire AI</h2>
                            <p className="text-xs text-slate-500 mt-1">Select demo role to instantly launch preview portal</p>
                        </div>

                        {/* Instant Role Selection Switch */}
                        <div className="grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                            {['student', 'tpo', 'admin'].map((r) => (
                                <button
                                    key={r}
                                    onClick={() => setRole(r)}
                                    className={`py-2 text-xs font-bold uppercase rounded-xl transition ${
                                        role === r ? 'bg-white text-brand-700 shadow-xs' : 'text-slate-500'
                                    }`}
                                >
                                    {r}
                                </button>
                            ))}
                        </div>

                        <div className="p-3 bg-brand-50 rounded-xl border border-brand-100 text-xs text-brand-900 font-medium">
                            <span className="font-bold">Demo Account Credentials:</span>
                            <div className="mt-1 text-[11px] font-mono">Email: {role}@campushire.demo</div>
                            <div className="text-[11px] font-mono">Pass: Demo123</div>
                        </div>

                        <button 
                            onClick={() => onLogin(role)} 
                            className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-xs shadow-md shadow-brand-500/20 transition"
                        >
                            Launch {role.toUpperCase()} Workspace
                        </button>
                    </div>
                </div>
            );
        };

        
        const App = () => {
            const [view, setView] = useState('landing'); // 'landing', 'login', 'dashboard', 'docs'
            const [activeRole, setActiveRole] = useState('STUDENT');
            const [currentUser, setCurrentUser] = useState(null);
            const [toast, setToast] = useState(null);

            // Seed Data State
            const [students] = useState(INITIAL_STUDENTS);
            const [companies] = useState(INITIAL_COMPANIES);
            const [applications] = useState(INITIAL_APPLICATIONS);
            const [announcements] = useState(INITIAL_ANNOUNCEMENTS);

            // Toast Trigger Helper
            const triggerToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            // Initialize Lucide Icons after DOM Updates
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Handle Direct Role Login
            const handleLogin = (roleKey) => {
                const userObj = DEMO_USERS[roleKey] || DEMO_USERS.student;
                setCurrentUser(userObj);
                setActiveRole(userObj.role);
                setView('dashboard');
                triggerToast(`Logged in successfully as ${userObj.name}`, "success");
            };

            const handleSwitchRole = (roleKey) => {
                const userObj = DEMO_USERS[roleKey] || DEMO_USERS.student;
                setCurrentUser(userObj);
                setActiveRole(userObj.role);
                triggerToast(`Switched active view to ${roleKey.toUpperCase()}`, "info");
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('landing');
                triggerToast("Logged out successfully", "info");
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar 
                        currentUser={currentUser}
                        activeRole={activeRole}
                        onSwitchRole={handleSwitchRole}
                        onNavigate={(v) => setView(v)}
                        onLogout={handleLogout}
                        notifications={announcements}
                    />

                    <div className="flex-1">
                        {view === 'landing' && <LandingPage onGetStarted={(r) => handleLogin(r)} onNavigate={(v) => setView(v)} />}
                        {view === 'login' && <LoginPage onLogin={handleLogin} onNavigate={(v) => setView(v)} />}
                        {view === 'docs' && <DocumentationPage />}
                        
                        {view === 'dashboard' && currentUser && (
                            <>
                                {activeRole === 'STUDENT' && (
                                    <StudentDashboard 
                                        currentUser={currentUser}
                                        companies={companies}
                                        applications={applications}
                                        announcements={announcements}
                                        onTriggerToast={triggerToast}
                                    />
                                )}
                                {activeRole === 'TPO' && (
                                    <TpoDashboard 
                                        students={students}
                                        companies={companies}
                                        onTriggerToast={triggerToast}
                                    />
                                )}
                                {activeRole === 'ADMIN' && (
                                    <AdminDashboard onTriggerToast={triggerToast} />
                                )}
                            </>
                        )}
                    </div>

                    <Toast toast={toast} onClose={() => setToast(null)} />
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
